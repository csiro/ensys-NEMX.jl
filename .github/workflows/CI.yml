name: CI

on:
  push:
    branches: [main, master]
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  # Cancel superseded runs on the same ref, but never cancel a run on main.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: julia ${{ matrix.version }} - ${{ matrix.runner.os }} - ${{ matrix.runner.arch }}
    runs-on: ${{ matrix.runner.os }}
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'      # lowest supported, per [compat]
          - '1'         # latest stable
        # Architecture is pinned to its runner rather than being a free
        # dimension of its own: macOS-latest is Apple Silicon, and asking
        # setup-julia for x64 there fails instead of quietly cross-installing.
        runner:
          - {os: ubuntu-latest,  arch: x64}
          - {os: macOS-latest,   arch: aarch64}
          - {os: windows-latest, arch: x64}

    steps:
      - uses: actions/checkout@v4

      # Every third-party action here has to sit on the enterprise allowlist,
      # which admits only setup-julia at this exact tag and cache at one of two
      # pinned commits. The julia-actions helpers (buildpkg, runtest,
      # processcoverage) are not on it, so their few lines of work are spelled
      # out as plain `julia` invocations below.
      - uses: julia-actions/setup-julia@v3.0.2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.runner.arch }}

      - uses: julia-actions/cache@a7bed9df697e5d7309d68afe7542a87621a8b6c8 # v3.3.0

      - name: Instantiate and build
        run: julia --color=yes --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.build()'

      - name: Run the test suite
        env:
          # The slow AC and IVR regressions on the 2000-bus case run on one
          # configuration only. They add ~2.5 minutes and are platform
          # independent, so paying for them six times over buys nothing.
          NEMX_TEST_SLOW: ${{ (matrix.version == '1' && matrix.runner.os == 'ubuntu-latest') && '1' || '0' }}
          # Never in CI: these download hundreds of megabytes from AEMO, and a
          # test suite must not depend on a third party's availability.
          NEMX_TEST_NETWORK: '0'
          # No display on a runner; PlotlyJS must not try to open a window.
          NEMX_NO_DISPLAY: '1'
        run: |
          julia --color=yes --project=. -e '
            using Pkg
            Pkg.test(coverage = true,
                     julia_args = ["--check-bounds=yes", "--depwarn=yes"])'

      - name: Collect coverage into lcov.info
        # Coverage.jl goes in a throwaway environment so it can never perturb
        # the resolved versions the tests above just ran against.
        run: |
          julia --color=yes -e '
            using Pkg
            Pkg.activate(; temp = true)
            Pkg.add("Coverage")
            using Coverage
            LCOV.writefile("lcov.info", process_folder("src"))'

      - uses: actions/upload-artifact@v4
        with:
          # codecov/codecov-action is not on the enterprise allowlist, so the
          # report is kept as a build artifact instead of being pushed to a
          # third-party service.
          name: lcov-${{ matrix.version }}-${{ matrix.runner.os }}-${{ matrix.runner.arch }}
          path: lcov.info
          if-no-files-found: warn
          retention-days: 14

  scripts:
    # Every script must at least PARSE and load its dependencies. A script that
    # has drifted out of step with the library is invisible to the unit tests,
    # because nothing includes it — this is the cheapest guard against that.
    name: scripts parse
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v3.0.2
        with:
          version: '1'
      - uses: julia-actions/cache@a7bed9df697e5d7309d68afe7542a87621a8b6c8 # v3.3.0
      - name: Instantiate and build
        run: julia --color=yes --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.build()'
      - name: Parse every script
        run: |
          julia --project=. -e '
            function main()
                bad = String[]
                for (root, dirs, files) in walkdir("scripts")
                    for file in sort(files)
                        endswith(file, ".jl") || continue
                        path = joinpath(root, file)
                        try
                            Meta.parseall(read(path, String))
                            println("  ok    ", path)
                        catch err
                            push!(bad, path)
                            println("  FAIL  ", path, " :: ",
                                    first(sprint(showerror, err), 200))
                        end
                    end
                end
                isempty(bad) || error("$(length(bad)) script(s) failed to parse")
            end
            main()'

      - name: Run the examples that need no downloaded data
        env:
          NEMX_NO_DISPLAY: '1'
        run: |
          julia --project=. scripts/zbenchmark/zonal_simple_example.jl
